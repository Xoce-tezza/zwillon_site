<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <title>Панель заявок ZWILLON</title>
  <style>
    :root { --bg:#0b0b0b; --card:#141414; --border:rgba(255,255,255,.1); --text:#fff; --muted:#aaa; --accent:#ffc107; --wa:#25d366; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Manrope,system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px; }
    .wrap { max-width:920px; margin:0 auto; }
    h1 { font-size:1.5rem; margin:0 0 8px; }
    .sub { color:var(--muted); font-size:14px; margin-bottom:20px; }
    .topbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:20px; }
    .topbar a.back { color:var(--muted); text-decoration:none; font-size:14px; margin-right:auto; }
    .topbar a.back:hover { color:var(--accent); }
    .btn-logout { padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-size:13px; }
    .btn-logout:hover { color:var(--text); border-color:rgba(255,193,7,.35); }
    .login-card { max-width:400px; margin:40px auto; padding:28px; background:var(--card); border:1px solid var(--border); border-radius:16px; }
    .login-card h2 { margin:0 0 16px; font-size:1.25rem; }
    .login-card input { width:100%; margin-bottom:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#0b0b0b; color:var(--text); font-size:15px; }
    .login-card button { width:100%; margin-top:8px; padding:12px; border:none; border-radius:12px; background:var(--accent); color:#111; font-weight:700; cursor:pointer; font-size:15px; }
    .login-err { color:#f87171; font-size:14px; margin-top:10px; display:none; }
    .filters { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; align-items:center; }
    .filters select, .filters input { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0b0b0b; color:var(--text); font-size:14px; min-width:160px; }
    .filters input { flex:1; min-width:200px; }
    .empty, .error { color:var(--muted); padding:16px; border-radius:12px; border:1px solid var(--border); }
    .error { color:#f87171; }
    .lead-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
    .lead-card strong { font-size:17px; }
    .lead-date { font-size:12px; color:var(--muted); float:right; }
    .lead-row { margin-top:10px; font-size:14px; line-height:1.5; }
    .lead-row span { color:var(--muted); display:inline-block; min-width:100px; }
    .lead-row a { color:var(--accent); }
    .lead-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .lead-actions a, .lead-actions button { padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; border:1px solid var(--border); background:rgba(255,255,255,.06); color:var(--text); }
    .lead-actions a:hover, .lead-actions button:hover { border-color:rgba(255,193,7,.4); }
    .lead-actions .wa { background:rgba(37,211,102,.15); border-color:rgba(37,211,102,.35); color:#afffc7; }
    .lead-actions .wa:hover { filter:brightness(1.1); }
    .lead-actions .primary { background:rgba(255,193,7,.12); border-color:rgba(255,193,7,.35); color:var(--accent); }
    .status-pill { display:inline-block; margin-top:12px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:4px 10px; border-radius:8px; background:rgba(255,193,7,.12); color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView" class="login-card">
      <h2>Вход</h2>
      <input type="text" id="loginUser" placeholder="Логин" autocomplete="username" />
      <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password" />
      <button type="button" id="loginBtn">Войти</button>
      <p class="login-err" id="loginErr">Неверный логин или пароль</p>
    </div>
    <div id="crmView" style="display:none">
      <div class="topbar">
        <a class="back" href="/index.html">На сайт</a>
        <button type="button" class="btn-logout" id="logoutBtn">Выйти</button>
      </div>
      <h1>Заявки</h1>
      <p class="sub">База: <code>db.json</code> · WhatsApp менеджера: +7 778 238 8238</p>
      <div class="filters">
        <select id="filterStatus" aria-label="Фильтр по статусу">
          <option value="all">Все статусы</option>
          <option value="new">Новые</option>
          <option value="in-progress">В работе</option>
          <option value="done">Готово</option>
        </select>
        <input type="search" id="filterPhone" placeholder="Поиск по телефону" />
      </div>
      <div id="leads"></div>
    </div>
  </div>
  <script defer src="/admin.js"></script>
</body>
</html>
