<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <title>Карточка товара — ZWILLON</title>
  <meta name="description" content="Карточка товара ZWILLON: описание, фото, характеристики. Оптовая цена и условия — по запросу." />
  <meta name="keywords" content="посуда оптом, кухонная посуда оптом, поставщик посуды, HoReCa посуда" />
  <meta name="robots" content="index,follow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{--bg:#0B0B0B;--text:#FFFFFF;--muted:#AAAAAA;--accent:#FFC107;--accent2:#FFD000}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:Manrope,Inter,system-ui,sans-serif;overflow-x:hidden}
    .text-muted{color:var(--muted)}
    .text-accent{color:var(--accent)}
    .bg-accent{background:var(--accent)}
    .bg-accent2{background:var(--accent2)}
    .shadow-accent{box-shadow:0 0 0 1px rgba(255,193,7,.28), 0 18px 60px rgba(0,0,0,.55), 0 0 36px rgba(255,193,7,.2)}
    .site-container{max-width:1280px;margin:0 auto;padding:0 24px}
    .card-desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .reveal{opacity:0;transform:translateY(30px);transition:opacity 720ms cubic-bezier(.2,.8,.2,1), transform 720ms cubic-bezier(.2,.8,.2,1);will-change:opacity,transform}
    .reveal.is-visible{opacity:1;transform:translateY(0)}
    .card-hover{transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;border-color:rgba(255,255,255,.10)}
    .card-hover:hover{transform:scale(1.04);border-color:rgba(255,193,7,.35);box-shadow:0 0 0 1px rgba(255,193,7,.18),0 18px 70px rgba(0,0,0,.55)}
    .btn-premium{
      transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
      will-change:transform,filter,box-shadow;
      border-radius:12px !important;
      padding:12px 20px !important;
    }
    .btn-premium:not(.shadow-accent){box-shadow:0 0 0 1px rgba(255,193,7,.18)}
    .btn-premium:hover{transform:scale(1.02);filter:brightness(1.08)}
    .btn-premium:not(.shadow-accent):hover{box-shadow:0 0 0 1px rgba(255,193,7,.32), 0 0 0 6px rgba(255,193,7,.08)}
    .btn-premium.shadow-accent:hover{box-shadow:0 0 0 1px rgba(255,193,7,.38), 0 18px 60px rgba(0,0,0,.55), 0 0 44px rgba(255,193,7,.26), 0 0 0 6px rgba(255,193,7,.1)}
    .btn-premium:active{transform:scale(.98)}
    .focus-premium:focus-visible{outline:none;border-color:rgba(255,193,7,.60);box-shadow:0 0 0 1px rgba(255,193,7,.55),0 0 0 4px rgba(255,193,7,.18)}
    .image-zoom{transition:transform .5s ease}
    .group:hover .image-zoom{transform:scale(1.06)}
    .nav-scrolled{background:rgba(11,11,11,.88)!important;backdrop-filter:blur(16px)}
    a.logo{font-size:15px;font-weight:700;letter-spacing:.22em;color:var(--text);text-decoration:none}
    a.logo:hover{color:var(--accent)}
    #siteHeader .nav > a,
    #siteHeader #mobilePanel > .site-container > a:not(.btn-premium){
      font-size:18px;
      font-weight:500;
      transition:color .2s ease;
    }
    #siteHeader .nav > a:hover,
    #siteHeader #mobilePanel > .site-container > a:not(.btn-premium):hover{
      color:#FFC107;
    }

    .apple-product{
      display:flex;
      gap:80px;
      padding:60px 0;
      color:#fff;
      align-items:flex-start;
      flex-wrap:wrap;
      opacity:0;
      transform:translateY(40px);
      transition:all .6s ease;
    }
    .apple-product.show{
      opacity:1;
      transform:translateY(0);
    }
    .gallery{
      flex:1 1 520px;
      position:relative;
      min-width:0;
    }
    .main-img{
      width:100%;
      height:500px;
      object-fit:cover;
      border-radius:24px;
      background:#111;
      display:block;
      transition:transform .3s ease, opacity .3s ease;
    }
    .gal-nav{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,.1);
      border:none;
      font-size:30px;
      color:#fff;
      width:50px;
      height:50px;
      border-radius:50%;
      cursor:pointer;
      transition:background .2s, transform .15s;
    }
    .gal-nav:hover{background:rgba(255,255,255,.2)}
    .gal-nav:active{transform:translateY(-50%) scale(.95)}
    .prev{left:10px}
    .next{right:10px}
    .thumbs{
      display:flex;
      gap:10px;
      margin-top:15px;
      flex-wrap:wrap;
    }
    .thumb{
      width:70px;
      height:70px;
      object-fit:cover;
      border-radius:12px;
      opacity:.5;
      cursor:pointer;
      border:2px solid transparent;
      transition:opacity .2s, border-color .2s;
      background:#111;
    }
    .thumb.active{
      opacity:1;
      border:2px solid #ffc107;
    }
    .info{
      flex:1 1 360px;
      max-width:500px;
      min-width:0;
      position:sticky;
      top:100px;
    }
    .info h1{
      font-size:32px;
      margin-bottom:20px;
      line-height:1.2;
      letter-spacing:-.02em;
    }
    .description{
      display:flex;
      flex-direction:column;
      gap:10px;
      opacity:.8;
    }
    .spec-line{
      border-bottom:1px solid rgba(255,255,255,.1);
      padding-bottom:6px;
      line-height:1.6;
    }
    .cta{
      margin-top:30px;
      background:#ffc107;
      color:#111;
      padding:15px 30px;
      border-radius:14px;
      border:none;
      font-weight:700;
      cursor:pointer;
      transition:filter .18s ease, transform .18s ease, box-shadow .18s ease;
      box-shadow:0 0 0 1px rgba(255,193,7,.28), 0 18px 60px rgba(0,0,0,.55), 0 0 36px rgba(255,193,7,.2);
    }
    .cta:hover{
      filter:brightness(1.08);
      transform:scale(1.05);
      box-shadow:0 0 0 1px rgba(255,193,7,.38), 0 18px 60px rgba(0,0,0,.55), 0 0 44px rgba(255,193,7,.26), 0 0 0 6px rgba(255,193,7,.1);
    }
    .cta:active{transform:scale(.98)}
    .b2b-hint{
      font-size:14px;
      color:rgba(255,255,255,.65);
      margin:0 0 16px;
      line-height:1.5;
      border-left:3px solid #ffc107;
      padding-left:12px;
    }
    .product-actions{display:flex;flex-direction:column;gap:12px;margin-top:24px;width:100%;max-width:500px}
    .product-actions .cta{width:100%;box-sizing:border-box;margin-top:0;text-align:center}
    .wa-wrap{display:flex;flex-direction:column;gap:8px;width:100%}
    .wa-trust{font-size:12px;color:rgba(255,255,255,.55);line-height:1.45;margin:0;text-align:center}
    @keyframes wa-pulse-product{
      0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.45)}
      55%{box-shadow:0 0 0 12px rgba(37,211,102,0)}
    }
    .btn.whatsapp{
      display:block;
      width:100%;
      box-sizing:border-box;
      margin:0;
      padding:15px 30px;
      border-radius:14px;
      background:#25D366;
      color:#fff;
      text-align:center;
      text-decoration:none;
      font-weight:700;
      font-size:16px;
      border:none;
      cursor:pointer;
      transition:filter .18s ease, transform .18s ease;
    }
    .btn.whatsapp.whatsapp-pulse{animation:wa-pulse-product 2.4s ease-in-out infinite}
    .btn.whatsapp:hover{filter:brightness(1.08)}
    .btn.whatsapp:active{transform:scale(.98)}
    #leadModal.modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:90;
      background:rgba(0,0,0,.75);
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    #leadModal.modal:not(.hidden){display:flex}
    #leadModal .modal-content{
      width:100%;
      max-width:440px;
      background:#141414;
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      padding:24px;
      color:#fff;
    }
    #leadModal .modal-content h3{margin:0 0 8px;font-size:1.25rem}
    #leadModal .modal-product{font-size:13px;color:#aaa;margin-bottom:16px}
    #leadModal .modal-content input,
    #leadModal .modal-content textarea{
      width:100%;
      box-sizing:border-box;
      margin-bottom:12px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:#0b0b0b;
      color:#fff;
      font-size:15px;
    }
    #leadModal .modal-content textarea{min-height:100px;resize:vertical}
    #leadModal .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    #leadModal .modal-actions button{
      flex:1;
      min-width:120px;
      padding:12px;
      border-radius:12px;
      border:none;
      font-weight:700;
      cursor:pointer;
      font-size:15px;
    }
    #leadModal .btn-submit{background:#ffc107;color:#111}
    #leadModal .btn-cancel{background:rgba(255,255,255,.08);color:#fff}
    @media (max-width:900px){
      .apple-product{gap:36px;padding:28px 0 42px}
      .main-img{height:380px}
      .info h1{font-size:28px}
      .info{position:static}
    }
  </style>
</head>

<body>
  <header id="siteHeader" class="sticky top-0 z-50 bg-[#0B0B0B]/80 backdrop-blur border-b border-white/10">
    <div class="site-container h-[72px] flex items-center justify-between">
      <a href="/index.html" class="logo">ZWILLON</a>
      <nav class="nav hidden md:flex items-center gap-8 text-muted">
        <a class="hover:text-white transition" href="/catalog.html">Каталог</a>
        <a class="hover:text-white transition" href="/index.html#about">О компании</a>
        <a class="hover:text-white transition" href="/index.html#business">Для бизнеса</a>
        <a class="hover:text-white transition" href="/index.html#contacts">Контакты</a>
      </nav>
      <a href="#" onclick="openLeadModal('Запрос прайса'); return false;" class="hidden md:inline-flex items-center justify-center px-5 py-2 rounded-xl bg-accent text-black font-semibold text-[14px] shadow-accent btn-premium">
        Получить прайс
      </a>
      <button id="menuBtn" class="md:hidden w-10 h-10 rounded-xl border border-white/10 bg-white/5 grid place-items-center hover:bg-white/10 transition" aria-label="Открыть меню" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 5.25H17" stroke="white" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3 10H17" stroke="white" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3 14.75H17" stroke="white" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="mobilePanel" class="md:hidden hidden border-t border-white/10 bg-[#0B0B0B]/70">
      <div class="site-container py-3 flex flex-col gap-2 text-[14px]">
        <a class="py-2 text-muted hover:text-white transition" href="/catalog.html">Каталог</a>
        <a class="py-2 text-muted hover:text-white transition" href="/index.html#about">О компании</a>
        <a class="py-2 text-muted hover:text-white transition" href="/index.html#business">Для бизнеса</a>
        <a class="py-2 text-muted hover:text-white transition" href="/index.html#contacts">Контакты</a>
        <a href="#" onclick="openLeadModal('Запрос прайса'); return false;" class="mt-2 px-4 py-2 rounded-xl bg-accent text-black font-semibold shadow-accent btn-premium text-center">Получить прайс</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="py-[80px] border-t border-white/10">
      <div class="site-container">
        <div class="flex items-center justify-between gap-3">
          <a href="/catalog.html" class="text-sm text-muted hover:text-white transition">← Назад в каталог</a>
          <div class="text-xs tracking-[.18em] text-muted font-semibold" id="productMeta"></div>
        </div>

        <div class="product mt-8" id="productRoot"></div>
      </div>
    </section>
  </main>

  <div id="leadModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <h3>Запрос оптовой цены</h3>
      <p class="modal-product">Товар: <span id="leadModalProductName"></span></p>
      <p id="leadModalErr" class="hidden" role="alert"></p>
      <input id="leadFieldName" type="text" placeholder="Имя" autocomplete="name" />
      <input id="leadFieldPhone" type="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" autocomplete="tel" />
      <input id="leadFieldCity" type="text" placeholder="Город" autocomplete="address-level2" />
      <textarea id="leadFieldComment" placeholder="Комментарий" rows="4"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeLeadModal()">Отмена</button>
        <button type="button" class="btn-submit" onclick="submitLead()">Отправить</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-white/10 py-10">
    <div class="site-container text-sm text-muted flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
      <div>© <span id="year"></span> ZWILLON. Все права защищены.</div>
      <div>Посуда и техника оптом — документы и логистика под B2B.</div>
    </div>
  </footer>

  <script src="/zwillon-shared.js"></script>
  <script src="/product-lead.js"></script>
  <script src="/product.js"></script>

</body>
</html>
